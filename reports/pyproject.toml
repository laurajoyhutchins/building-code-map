[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "building-code-map-report-tools"
version = "0.1.0"
description = "Deterministic report conversion and validation tooling for Building Code Map."
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
