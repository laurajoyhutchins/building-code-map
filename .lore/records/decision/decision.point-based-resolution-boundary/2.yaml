payload:
  decision: Preserve POST /resolve as a point-only public contract. Normalized geographic context is internal evidence derived from the validated boundary snapshot, not caller input.
  composition: POST /lookup preserves geocoding evidence, uses the selected candidate point, and invokes the same boundary and regulatory path.
  ambiguity_policy: More than one containing state, county, or municipality returns deterministic ambiguity evidence and does not select a policy context by feature order.
  nonexclusive_observations:
    - special_areas
    - tribal_areas
    - neris_jurisdictions
  rationale:
    - Address quality must remain inspectable independently from regulatory conclusions.
    - Coordinate callers must continue to work without a geocoder snapshot.
    - Polygon containment must not become caller-authored legal authority.
    - Address parsing, candidate ranking, and boundary order must not become state regulatory policy.
