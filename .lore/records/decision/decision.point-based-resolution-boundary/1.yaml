payload:
  decision: Preserve POST /resolve as a point or normalized-context contract.
  composition: POST /lookup geocodes an address and then invokes the same regulatory resolution path.
  rationale:
    - Address quality must remain inspectable independently from regulatory conclusions.
    - Coordinate callers must continue to work without a geocoder snapshot.
    - Address parsing and ranking must not become state regulatory policy.
