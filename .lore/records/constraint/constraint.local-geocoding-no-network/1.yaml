payload:
  requirement: No lookup-time request to Census, Nominatim, Pelias, or another external geocoding service.
  failure_behavior: Missing or invalid geocoder data disables address endpoints without disabling coordinate resolution.
  data_location: The configured SQLite path must remain inside the backend checkout.
