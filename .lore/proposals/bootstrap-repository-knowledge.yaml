    id: decision.local-first-deterministic-resolution
    kind: decision
    revision: 1
    status: active
    title: Resolve from local deterministic evidence
    summary: Runtime resolution uses local snapshots and compiled evidence instead of live lookup or retrieval-only
      inference.
    scope:
      repository: building-code-map
      components:
      - component.backend-api
      - component.local-snapshot
      - component.regulatory-resolution
    evidence:
    - revision: e349e9be689aeccf1eeed6c01bf7cc6796a746be
      path: README.md
    - revision: e349e9be689aeccf1eeed6c01bf7cc6796a746be
      path: docs/reference/runtime-and-api.md
    - revision: e349e9be689aeccf1eeed6c01bf7cc6796a746be
      path: docs/reference/regulatory-resolution.md
    disclosure:
      audiences:
      - architecture
      - maintainer
      tags:
      - deterministic
      - local-first
      weight: 100
    provenance:
      source: proposal
      transaction: null
      producer: lore-maintainer-skill
    supersedes: null
    payload:
      rationale:
      - Regulatory results must be reproducible and inspectable.
      - Offline operation avoids hidden dependency on mutable external services.
      consequences:
      - Snapshots and regulatory catalogs require explicit refresh and provenance.
      - Missing local evidence is returned instead of inferred.
      alternatives:
      - Live service lookup
      - RAG-only resolution
      exclusivity_key: runtime-resolution-source
