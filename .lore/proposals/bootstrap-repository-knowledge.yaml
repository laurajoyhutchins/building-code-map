  record:
    schema_version: 1
    id: procedure.exact-head-verification
    kind: procedure
    revision: 1
    status: active
    title: Verify the exact pull-request head before merge
    summary: Review and required checks clear only the exact current pull-request head; any head movement requires
      renewed verification.
    scope:
      repository: building-code-map
      components:
      - component.documentation-governance
    evidence:
    - revision: e349e9be689aeccf1eeed6c01bf7cc6796a746be
      path: docs/reference/repository-governance.md
    - revision: e349e9be689aeccf1eeed6c01bf7cc6796a746be
      path: CONTRIBUTING.md
    disclosure:
      audiences:
      - contributor
      - maintainer
      tags:
      - ci
      - review
      weight: 95
    provenance:
      source: proposal
      transaction: null
      producer: lore-maintainer-skill
    supersedes: null
    payload:
      prerequisites:
      - Pull request head SHA is known.
      - Required status checks are configured.
      steps:
      - Confirm the reviewed SHA is still the current pull-request head.
      - Confirm required checks passed for that SHA.
      - Confirm review conversations are resolved.
      - Squash merge with an outcome-focused title.
      - Confirm the resulting commit is on main and the source branch is deleted.
      failure_handling:
      - A successful run on an older head does not clear a newer head.
      - Any head movement requires re-verification.
uncertainties:
- The @laurajoyhutchins/lore 0.1.0 package is not yet published; validate this proposal again with the exact released
  CLI before applying it.
- Current deterministic extractors do not completely model Go and Python internals, so semantic records describe
  those components from reviewed evidence.
- Open Building Code Map pull requests may change component behavior before activation and may require superseding
  record revisions.
