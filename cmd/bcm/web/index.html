<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Building Code Map</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="./" aria-label="Building Code Map">BCM <span>Building Code Map</span></a>
      <span class="mode">Demo</span>
    </header>
    <main>
      <div class="intro">
        <p class="kicker">Project codes</p>
        <h1>Building Code Map</h1>
        <p>Review code editions, supporting records, and questions that still need an answer.</p>
      </div>
      <section class="workspace" aria-labelledby="lookup-title">
        <div class="section-heading"><span>Project</span><h2 id="lookup-title">Project details</h2></div>
        <form id="lookup">
          <label for="project-id">Project ID</label>
          <input id="project-id" name="project-id" value="DEMO-001" required maxlength="120">
          <label for="address">Location <small>Fictional address only</small></label>
          <input id="address" name="address" value="100 Demo Plaza, DEMO-XX" required>
          <div class="field-row">
            <div><label for="as-of">Applicability date</label><input id="as-of" name="as-of" type="date" required></div>
            <div><label for="occupancy">Occupancy <small>Optional project fact</small></label><input id="occupancy" name="occupancy" placeholder="e.g. business"></div>
          </div>
          <button type="submit" id="submit">Run demo <span aria-hidden="true">↗</span></button>
        </form>
      </section>
      <section class="result" id="result-panel" hidden aria-labelledby="result-heading">
        <div class="section-heading"><span>Result</span><h2 id="result-heading">Code basis</h2></div>
        <div id="result-content" aria-live="polite"></div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <footer><span>Example data. Not a code determination.</span><a href="https://github.com/laurajoyhutchins/building-code-map">Source code</a></footer>
  </div>
</body>
</html>
