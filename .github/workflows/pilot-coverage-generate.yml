name: Generate pilot entity coverage ledger

on:
  push:
    branches:
      - feature/pilot-entity-coverage-ledger
    paths:
      - .github/workflows/pilot-coverage-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact generator head
        uses: actions/checkout@v4
        with:
          ref: feature/pilot-entity-coverage-ledger

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate and validate canonical pilot ledger
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/coverage-ledger-build generate \
            --inventory-root data/governmental-entities/2025 \
            --regimes-root data/state-regimes \
            --output data/jurisdiction-coverage/pilot-building-2026-08-08.json \
            --states US-CO,US-FL,US-NC,US-NJ,US-OR,US-VA \
            --code-family building \
            --applicability-date 2026-08-08
          go run ./cmd/coverage-ledger-build validate \
            --inventory-root data/governmental-entities/2025 \
            --regimes-root data/state-regimes \
            --output data/jurisdiction-coverage/pilot-building-2026-08-08.json \
            --states US-CO,US-FL,US-NC,US-NJ,US-OR,US-VA \
            --code-family building \
            --applicability-date 2026-08-08

      - name: Print coverage summaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('backend/data/jurisdiction-coverage/pilot-building-2026-08-08.json').read_text())
          print('NATIONAL', json.dumps(data['summary'], sort_keys=True))
          for state in data['states']:
              print(state['state_id'], json.dumps(state['summary'], sort_keys=True))
          print('FRESHNESS', json.dumps(data['freshness'], sort_keys=True))
          print('LAND_AREA', json.dumps(data['land_area'], sort_keys=True))
          PY

      - name: Commit generated ledger
        shell: bash
        run: |
          set -euo pipefail
          path='backend/data/jurisdiction-coverage/pilot-building-2026-08-08.json'
          if [[ -z "$(git status --porcelain -- "$path")" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'data: generate pilot building coverage ledger'
          git push origin HEAD:feature/pilot-entity-coverage-ledger
