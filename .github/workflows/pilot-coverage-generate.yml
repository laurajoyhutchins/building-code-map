name: Canonicalize pilot entity coverage implementation

on:
  push:
    branches:
      - feature/pilot-entity-coverage-ledger
    paths:
      - .github/workflows/pilot-coverage-generate.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/pilot-entity-coverage-ledger

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize Go and schema formatting
        run: |
          gofmt -w \
            backend/regulatory/coverage_ledger.go \
            backend/regulatory/coverage_ledger_io.go \
            backend/regulatory/coverage_ledger_test.go \
            backend/cmd/coverage-ledger-build/main.go
          pnpm exec prettier schemas/regulatory/entity-coverage-ledger.schema.json --write

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            backend/regulatory/coverage_ledger.go
            backend/regulatory/coverage_ledger_io.go
            backend/regulatory/coverage_ledger_test.go
            backend/cmd/coverage-ledger-build/main.go
            schemas/regulatory/entity-coverage-ledger.schema.json
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'style: canonicalize pilot coverage implementation'
          git push origin HEAD:feature/pilot-entity-coverage-ledger
