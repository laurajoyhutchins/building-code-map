name: Generate Census governmental entity corpus

on:
  push:
    branches:
      - feature/census-government-units-inventory
    paths:
      - .github/workflows/census-government-units-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact generator head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Fetch and verify pinned Census source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gov_units_2025.zip"
          source_dir="$RUNNER_TEMP/gov-units"
          curl --fail --location --retry 3 \
            --output "$archive" \
            'https://www2.census.gov/programs-surveys/gus/datasets/2025/gov_units_2025.zip'
          echo 'e8b17c3928fb95fa7355a1ce7795fc7de8874c64e9ac7cd9506d6a6515d953f8  '"$archive" | sha256sum --check --strict
          mkdir "$source_dir"
          unzip -q "$archive" -d "$source_dir"
          echo '840e8b65e5e65325c0a42fb842ea81c0491eae3abd8a41953764044ee9e2a56e  '"$source_dir/Govt_Units_2025_Final.xlsx" | sha256sum --check --strict
          echo 'd12278a7382943cc12ad501631374bc5c8688ba66292b61b0fe7eff9f4191f6d  '"$source_dir/Government_Units_List_Documentation_2025.pdf" | sha256sum --check --strict
          echo "CENSUS_WORKBOOK=$source_dir/Govt_Units_2025_Final.xlsx" >> "$GITHUB_ENV"

      - name: Extract pinned General Purpose sheet
        shell: bash
        run: |
          set -euo pipefail
          python reports/tools/census_government_units.py \
            "$CENSUS_WORKBOOK" \
            "$RUNNER_TEMP/general-purpose.csv"
          test "$(($(wc -l < "$RUNNER_TEMP/general-purpose.csv") - 1))" -eq 38704

      - name: Generate and validate national entity inventories
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(git show -s --format=%cI HEAD)"
          go run ./cmd/government-entities-build generate \
            --input "$RUNNER_TEMP/general-purpose.csv" \
            --output-dir data/governmental-entities/2025 \
            --source-contract data/governmental-entities/census-government-units-2025.source.json \
            --generated-at "$generated_at"
          go run ./cmd/government-entities-build validate \
            --root data/governmental-entities/2025 \
            --source-contract data/governmental-entities/census-government-units-2025.source.json
          test "$(find data/governmental-entities/2025 -maxdepth 1 -type f -name 'US-??.json' | wc -l)" -eq 51

      - name: Commit generated corpus
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add backend/data/governmental-entities/2025
          if git diff --cached --quiet; then
            echo 'generator produced no corpus changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: generate 2025 Census governmental entity inventory'
          git push origin HEAD:feature/census-government-units-inventory
