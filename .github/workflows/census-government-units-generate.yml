name: Inspect county-equivalent city source fields

on:
  push:
    branches:
      - feature/census-government-units-inventory
    paths:
      - .github/workflows/census-government-units-generate.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact importer head
        uses: actions/checkout@v4

      - name: Inspect pinned Census rows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gov_units_2025.zip"
          source_dir="$RUNNER_TEMP/gov-units"
          curl --fail --location --retry 3 \
            --output "$archive" \
            'https://www2.census.gov/programs-surveys/gus/datasets/2025/gov_units_2025.zip'
          echo 'e8b17c3928fb95fa7355a1ce7795fc7de8874c64e9ac7cd9506d6a6515d953f8  '"$archive" | sha256sum --check --strict
          mkdir "$source_dir"
          unzip -q "$archive" -d "$source_dir"
          echo '840e8b65e5e65325c0a42fb842ea81c0491eae3abd8a41953764044ee9e2a56e  '"$source_dir/Govt_Units_2025_Final.xlsx" | sha256sum --check --strict
          python reports/tools/census_government_units.py \
            "$source_dir/Govt_Units_2025_Final.xlsx" \
            "$RUNNER_TEMP/general-purpose.csv"
          python - "$RUNNER_TEMP/general-purpose.csv" <<'PY'
          import csv
          import sys

          names = {"CITY OF RICHMOND", "CITY OF BALTIMORE", "CITY OF ST LOUIS", "CITY OF ST. LOUIS"}
          with open(sys.argv[1], newline="", encoding="utf-8") as handle:
              for row in csv.DictReader(handle):
                  if row["UNIT_NAME"] in names:
                      print({key: row[key] for key in (
                          "CENSUS_ID_PID6",
                          "UNIT_NAME",
                          "UNIT_TYPE",
                          "POLITICAL_CODE_DESCRIPTION",
                          "STATE",
                          "FIPS_STATE",
                          "FIPS_COUNTY",
                          "FIPS_PLACE",
                          "COUNTY_AREA_NAME",
                          "ACTIVE",
                      )})
          PY
