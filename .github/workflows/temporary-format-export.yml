name: Temporary formatting export (read-only source)
on:
  push:
    branches: [chore/normalize-format-gate]
permissions:
  contents: read
jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format disposable copies and emit checked results
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          tracked = sorted(p for p in subprocess.check_output(['git', 'ls-files', '-z', '--', '*.go']).decode().split('\0') if p)
          changed = 0
          for path in tracked:
              before = Path(path).read_bytes()
              after = subprocess.run(['gofmt'], input=before, capture_output=True, check=True).stdout
              if before != after:
                  print('FORMAT_BLOB|' + path + '|' + base64.b64encode(after).decode(), flush=True)
                  changed += 1
          print(f'FORMAT_COUNT|{changed}', flush=True)
          PY
