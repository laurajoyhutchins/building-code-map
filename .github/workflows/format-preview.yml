name: Format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: pnpm exec prettier src/App.tsx src/components/PublicLookup.tsx --write

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-public-interface
          path: |
            src/App.tsx
            src/components/PublicLookup.tsx
