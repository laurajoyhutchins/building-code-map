name: Public Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public synthetic site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned schema-validation dependencies
        run: npm ci --ignore-scripts
      - name: Verify public source and contract boundary
        run: |
          go test ./...
          npm test
          npm run validate
      - name: Build allowlisted static artifact
        env:
          BCM_PUBLIC_API_BASE_URL: ${{ vars.BCM_PUBLIC_API_BASE_URL }}
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    name: Deploy public reference site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
