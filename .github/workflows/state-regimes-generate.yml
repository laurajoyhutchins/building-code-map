name: Generate pilot state regime projections

on:
  push:
    branches:
      - feature/state-regime-specs
    paths:
      - .github/workflows/state-regimes-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact generator head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate and validate regime projections
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/state-regimes-build generate \
            --profiles-root data/regulatory \
            --output-dir data/state-regimes
          go run ./cmd/state-regimes-build validate \
            --profiles-root data/regulatory \
            --root data/state-regimes
          test "$(find data/state-regimes -maxdepth 1 -type f -name 'US-??.json' | wc -l)" -eq 6

      - name: Commit generated projections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add backend/data/state-regimes
          if git diff --cached --quiet; then
            echo 'generator produced no state regime changes' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: generate pilot state regime projections'
          git push origin HEAD:feature/state-regime-specs
