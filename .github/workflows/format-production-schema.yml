name: Format production readiness schema

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format schema artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format schema
        run: pnpm exec prettier schemas/regulatory/production-readiness.schema.json --write

      - name: Upload formatted schema
        uses: actions/upload-artifact@v4
        with:
          name: formatted-production-readiness-schema
          path: schemas/regulatory/production-readiness.schema.json
          if-no-files-found: error
          retention-days: 1
