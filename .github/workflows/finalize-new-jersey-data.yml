name: Finalize New Jersey production data

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Finalize New Jersey data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update date-aware resolver expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/internal/regulatory/resolver_test.go")
          text = path.read_text(encoding="utf-8")
          old = '''func TestResolveNewJerseyHistoricalDateFailsClosedWithoutEditionTimeline(t *testing.T) {
          \tcatalog := loadTestCatalog(t)
          \tresult, err := Resolve(catalog, ResolutionRequest{
          \t\tContext:           &GeographicContext{StateID: "US-NJ", StateFIPS: "34", Municipality: &BoundaryMatch{Name: "Trenton"}},
          \t\tCodeFamily:        "building",
          \t\tApplicabilityDate: "2020-01-01",
          \t})
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif result.Status != "insufficient_evidence" || len(result.Adoptions) != 0 {
          \t\tt.Fatalf("undated current record leaked into historical result: %#v", result)
          \t}
          }
          '''
          new = '''func TestResolveNewJerseyHistoricalDatePreservesTransitionEditions(t *testing.T) {
          \tcatalog := loadTestCatalog(t)
          \tresult, err := Resolve(catalog, ResolutionRequest{
          \t\tContext:           &GeographicContext{StateID: "US-NJ", StateFIPS: "34", Municipality: &BoundaryMatch{Name: "Trenton"}},
          \t\tCodeFamily:        "building",
          \t\tApplicabilityDate: "2020-01-01",
          \t})
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tif result.Status != "partially_resolved" || len(result.Adoptions) != 2 {
          \t\tt.Fatalf("historical transition result = %#v, want two supported editions", result)
          \t}
          \tids := map[string]bool{}
          \tfor _, adoption := range result.Adoptions {
          \t\tids[adoption.ID] = true
          \t}
          \tif !ids["adoption:us-nj:building:2015"] || !ids["adoption:us-nj:building:2018"] {
          \t\tt.Fatalf("historical transition editions = %#v", result.Adoptions)
          \t}
          }
          '''
          if old not in text:
              raise SystemExit("New Jersey historical test block not found")
          text = text.replace(old, new)
          state_test = 'func TestResolveNewJerseyStateOwnedProjectAppliesProjectOverride(t *testing.T) {'
          marker = 'assertCandidateAuthority(t, result, "auth:us-nj:codes-standards")'
          start = text.index(state_test)
          index = text.index(marker, start)
          text = text[:index] + 'assertCandidateAuthority(t, result, "auth:us-nj:bcpr")' + text[index + len(marker):]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Compile canonical artifacts
        run: python reports/tools/regulatory.py compile reports/pilots/*.md --output-dir backend/data/regulatory

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-new-jersey-data.yml

      - name: Commit canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pilots/new-jersey.md backend/data/regulatory/new-jersey.json backend/data/regulatory/rules/new-jersey.json reports/production/new-jersey.json backend/internal/regulatory/resolver_test.go .github/workflows/finalize-new-jersey-data.yml
          git commit -m "data: complete New Jersey production evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
