name: Census 100-mile bulk query smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/bulk-grid-smoke.yml'
      - 'scripts/prepare_census_us_land.py'
      - 'scripts/generate_grid.py'
      - 'scripts/bulk_query.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bulk-grid-smoke.yml'
      - 'scripts/prepare_census_us_land.py'
      - 'scripts/generate_grid.py'
      - 'scripts/bulk_query.py'

permissions:
  contents: read

concurrency:
  group: bcm-census-grid-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-to-synthetic-query:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind candidate revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r tested base head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -z "${extra:-}"
            test "$tested" = "$EXPECTED_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          echo "Candidate: `$(git rev-parse HEAD)`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install pinned off-the-shelf geographic libraries
        run: python3 -m pip install --disable-pip-version-check --no-input 'pyshp==2.3.1' 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Fetch and verify authentic Census 2024 boundary archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bcm-census-grid"
          cd "$RUNNER_TEMP/bcm-census-grid"
          curl --fail --location --silent --show-error --retry 2 \
            --proto '=https' --tlsv1.2 \
            --output census-source.zip \
            'https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_state_500k.zip'
          echo '3e81cbb6cf5f60d9b01ef3e730afa14d61ce5f784252a0b33a696135e71447bc  census-source.zip' | sha256sum --check
          test "$(stat -c %s census-source.zip)" -eq 3242450
          echo "Census archive SHA-256: `3e81cbb6cf5f60d9b01ef3e730afa14d61ce5f784252a0b33a696135e71447bc`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: [2024 Census 1:500,000 states](https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_state_500k.zip)" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare exactly 50 states plus DC, then make 100-mile grid
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bcm-census-grid"
          python3 scripts/prepare_census_us_land.py \
            --archive "$dir/census-source.zip" \
            --archive-sha256 '3e81cbb6cf5f60d9b01ef3e730afa14d61ce5f784252a0b33a696135e71447bc' \
            --output "$dir/us-states.geojson" | tee "$dir/prepare-receipt.json"
          geo_sha="$(sha256sum "$dir/us-states.geojson" | cut -d' ' -f1)"
          python3 scripts/generate_grid.py \
            --geometry "$dir/us-states.geojson" --sha256 "$geo_sha" \
            --miles 100 --output "$dir/us-100mi.jsonl" | tee "$dir/grid-receipt.json"
          python3 - "$dir" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          prepare = json.loads((root / "prepare-receipt.json").read_text())
          grid = json.loads((root / "grid-receipt.json").read_text())
          assert prepare["state_equivalents"] == 51
          assert 300 <= grid["samples"] <= 10000, grid
          assert prepare["geometry_sha256"] == grid["geometry_sha256"]
          with (root / "us-100mi.jsonl").open() as file:
              ids = [json.loads(line)["id"] for line in file]
          assert len(ids) == grid["samples"] == len(set(ids))
          print("ACTUAL SOURCE GRID ACCEPTED:", grid["samples"], "positive-land-overlap cells")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write(f"\n### Geographic workload\n- state equivalents: 51\n- 100-mile cells: **{grid['samples']}**\n")
              file.write(f"- WGS84 geometry SHA-256: `{grid['geometry_sha256']}`\n")
          PY
      - name: Exercise canonical synthetic-only BCM API on every generated sample
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/bcm-census-grid"
          go run ./cmd/bcm -addr 127.0.0.1:8787 > "$dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..90}; do
            if curl --silent --fail http://127.0.0.1:8787/health > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat "$dir/server.log"; exit 1; fi
          python3 scripts/bulk_query.py \
            --input "$dir/us-100mi.jsonl" \
            --results "$dir/synthetic-outcomes.jsonl" \
            --summary "$dir/synthetic-summary.json" \
            --date 2026-10-28 \
            --concurrency 8 --qps 50 --timeout 8 --max-requests 10000
          python3 - "$dir" <<'PY'
          import json, pathlib, sys, hashlib, os
          root = pathlib.Path(sys.argv[1])
          s = json.loads((root / "synthetic-summary.json").read_text())
          n = sum(1 for line in (root / "us-100mi.jsonl").open())
          assert s["samples"] == n, (s, n)
          assert s["categories"] == {"unresolved": n}, s["categories"]
          assert s["http_statuses"] == {"422": n}, s["http_statuses"]
          assert s["input_sha256"] == hashlib.sha256((root / "us-100mi.jsonl").read_bytes()).hexdigest()
          assert all(json.loads(line)["error_code"] == "outside_supported_coverage"
                     for line in (root / "synthetic-outcomes.jsonl").open())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as file:
              file.write("\n### Synthetic canonical API probe (not national code coverage)\n")
              file.write(f"- submitted: **{n}**, expected unsupported: **{n}**, service failures: 0\n")
              file.write(f"- observed RPS: {s['requests_per_second']}; p95: {s['latency_p95_ms']} ms\n")
              file.write(f"- input SHA-256: `{s['input_sha256']}`\n")
          print("PASS: all", n, "source-bound Census grid samples refused without false legal authority")
          PY
