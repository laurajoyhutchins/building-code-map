name: Format entity classification schema

on:
  push:
    branches:
      - feature/entity-regime-classification
    paths:
      - .github/workflows/entity-classification-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/entity-regime-classification

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format schema
        run: pnpm exec prettier schemas/regulatory/entity-classification-decision.schema.json --write

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/regulatory/entity-classification-decision.schema.json
          git commit -m 'style: format entity classification schema'
          git push origin HEAD:feature/entity-regime-classification
