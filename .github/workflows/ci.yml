name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-bcm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact GitHub candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact CI candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            read -r tested base head extra <<< "$(git rev-list --parents -n 1 HEAD)"
            test -z "${extra:-}"
            test "$tested" = "$EXPECTED_SHA"
            test "$head" = "$PR_HEAD_SHA"
          fi
          echo "### Verification identity" >> "$GITHUB_STEP_SUMMARY"
          echo "- tested SHA: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate tree: \`$(git rev-parse 'HEAD^{tree}')\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "- source head: \`$PR_HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned schema-validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Go, Python and Node lint and test harness
        run: python3 tools/check.py
