name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  reports:
    name: Report tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: reports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: reports/pyproject.toml

      - name: Install dependencies
        run: python -m pip install ".[test]"

      - name: Test
        run: python -m pytest

      - name: Check canonical artifact serialization
        id: normalize-artifacts
        shell: bash
        run: |
          set -o pipefail
          python tools/normalize_artifacts.py --check | tee artifact-normalization.log

      - name: Validate generated artifacts
        id: validate-artifacts
        shell: bash
        run: |
          set -o pipefail
          python tools/validate_artifacts.py | tee artifact-validation.log

      - name: Upload report diagnostics
        if: failure() && (steps.normalize-artifacts.outcome == 'failure' || steps.validate-artifacts.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: report-artifact-validation
          path: |
            reports/artifact-normalization.log
            reports/artifact-validation.log
          if-no-files-found: warn

      - name: Verify table-backed authority regeneration
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          mapfile -t reports < <(
            find raw -maxdepth 1 -type f -name '*.md' ! -name 'alaska.md' -print | sort
          )
          python tools/batch_table_to_yaml.py \
            --output-dir "$output_dir" \
            "${reports[@]}"
          for generated in "$output_dir"/*.yaml; do
            diff -u \
              "yaml/authority-structure/$(basename "$generated")" \
              "$generated"
          done

      - name: Confirm read-only checks
        run: git diff --exit-code

  regulatory-data:
    name: Regulatory data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test compiler, quality reporting, and production gate
        run: python -m unittest discover -s reports/tools -p "test_*.py" -v

      - name: Validate pilot reports
        run: python reports/tools/regulatory.py validate reports/pilots/*.md

      - name: Verify compiled profiles are current
        run: python reports/tools/regulatory.py compile reports/pilots/*.md --output-dir backend/data/regulatory --check

      - name: Generate nationwide quality report
        run: >-
          python reports/tools/regulatory.py coverage
          --reports-root reports
          --json-output "${{ runner.temp }}/regulatory-coverage.json"
          --markdown-output "${{ runner.temp }}/regulatory-coverage.md"

      - name: Audit pilot production readiness
        run: |
          python reports/tools/production_readiness.py audit \
            --compiled-root backend/data/regulatory \
            --manifests-root reports/production \
            --json-output "${{ runner.temp }}/pilot-production-readiness.json" \
            --markdown-output "${{ runner.temp }}/pilot-production-readiness.md" \
            --fail-on-premature-verification
          python -c 'import json, sys; summary = json.load(open("${{ runner.temp }}/pilot-production-readiness.json"))["summary"]; sys.exit(1 if summary["blocked"] else 0)'

      - name: Upload regulatory quality reports
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-quality
          path: |
            ${{ runner.temp }}/regulatory-coverage.json
            ${{ runner.temp }}/regulatory-coverage.md
            ${{ runner.temp }}/pilot-production-readiness.json
            ${{ runner.temp }}/pilot-production-readiness.md
          if-no-files-found: error
          retention-days: 14

  lore:
    name: LORE documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Building Code Map
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Build pinned LORE
        env:
          LORE_REVISION: a8792bd594db34fcbf3065239b70ef4383f7e186
        run: |
          git clone --filter=blob:none https://github.com/laurajoyhutchins/LORE.git "$RUNNER_TEMP/lore"
          git -C "$RUNNER_TEMP/lore" checkout "$LORE_REVISION"
          cd "$RUNNER_TEMP/lore"
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Extract deterministic repository facts
        run: node "$RUNNER_TEMP/lore/dist/src/cli/main.js" extract

      - name: Validate repository documentation
        run: node "$RUNNER_TEMP/lore/dist/src/cli/main.js" validate
