name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  regulatory-data:
    name: Regulatory data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test compiler and quality reporting
        run: python -m unittest discover -s reports/tools -p test_regulatory.py -v

      - name: Validate pilot reports
        run: python reports/tools/regulatory.py validate reports/pilots/*.md

      - name: Verify compiled profiles are current
        run: python reports/tools/regulatory.py compile reports/pilots/*.md --output-dir backend/data/regulatory --check

      - name: Generate nationwide quality report
        run: >-
          python reports/tools/regulatory.py coverage
          --reports-root reports
          --json-output "${{ runner.temp }}/regulatory-coverage.json"
          --markdown-output "${{ runner.temp }}/regulatory-coverage.md"

  lore:
    name: LORE documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Building Code Map
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Build pinned LORE
        env:
          LORE_REVISION: a8792bd594db34fcbf3065239b70ef4383f7e186
        run: |
          git clone --filter=blob:none https://github.com/laurajoyhutchins/LORE.git "$RUNNER_TEMP/lore"
          git -C "$RUNNER_TEMP/lore" checkout "$LORE_REVISION"
          cd "$RUNNER_TEMP/lore"
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate repository documentation
        run: node "$RUNNER_TEMP/lore/dist/cli/main.js" validate
