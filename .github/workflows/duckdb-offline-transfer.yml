name: DuckDB offline transfer

on:
  push:
    branches:
      - ops/duckdb-offline-transfer
    paths:
      - .github/workflows/duckdb-offline-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer contract
        uses: actions/checkout@v4

      - name: Download and verify official DuckDB release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duckdb-transfer"
          cd "$RUNNER_TEMP/duckdb-transfer"
          curl --fail --location --retry 3 \
            --output duckdb_cli-linux-amd64-musl.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64-musl.zip
          actual_size=$(wc -c < duckdb_cli-linux-amd64-musl.zip | tr -d '[:space:]')
          test "$actual_size" = 22469200
          echo '4261fe20bab47d92742d5e21eee979e9e81548442985b9e3327725e1f755c910  duckdb_cli-linux-amd64-musl.zip' \
            | sha256sum -c -
          mapfile -t entries < <(unzip -Z1 duckdb_cli-linux-amd64-musl.zip)
          test "${#entries[@]}" -eq 1
          test "${entries[0]}" = duckdb
          unzip -p duckdb_cli-linux-amd64-musl.zip duckdb > duckdb
          chmod 0755 duckdb
          version_output=$(./duckdb --version)
          grep -F 'v1.5.5' <<<"$version_output"
          grep -F 'd8cdaa33fd' <<<"$version_output"
          smoke_output=$(./duckdb :memory: -csv -noheader -c 'SELECT 42;')
          test "$smoke_output" = 42
          payload_size=$(wc -c < duckdb | tr -d '[:space:]')
          payload_sha=$(sha256sum duckdb | awk '{print $1}')
          file_output=$(file -b duckdb)
          grep -F 'ELF 64-bit' <<<"$file_output"
          grep -F 'x86-64' <<<"$file_output"
          if readelf -l duckdb | grep -q 'INTERP'; then
            echo 'DuckDB musl payload unexpectedly has a dynamic interpreter' >&2
            exit 1
          fi
          python3 - "$version_output" "$smoke_output" "$payload_size" "$payload_sha" "$file_output" <<'PY'
          import json
          import sys
          from pathlib import Path
          version, smoke, payload_size, payload_sha, file_output = sys.argv[1:]
          receipt = {
              "schema_version": 1,
              "release_tag": "v1.5.5",
              "source_commit": "d8cdaa33fda8df955cc76ef58a280f68f4cd43fa",
              "transport": {
                  "name": "duckdb_cli-linux-amd64-musl.zip",
                  "bytes": 22469200,
                  "sha256": "4261fe20bab47d92742d5e21eee979e9e81548442985b9e3327725e1f755c910",
              },
              "payload": {
                  "name": "duckdb",
                  "bytes": int(payload_size),
                  "sha256": payload_sha,
                  "version_output": version,
                  "format": file_output,
              },
              "checks": {
                  "transport_identity": "passed",
                  "archive_shape": "passed",
                  "payload_identity": "passed",
                  "static_elf": "passed",
                  "version": "passed",
                  "smoke_sql": "passed",
              },
              "smoke_sql": "SELECT 42;",
              "smoke_output": smoke,
          }
          Path("verification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cp "$GITHUB_WORKSPACE/LICENSE" building-code-map-license.txt

      - name: Upload verified transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-1.5.5-linux-amd64-musl-transfer
          path: |
            ${{ runner.temp }}/duckdb-transfer/duckdb_cli-linux-amd64-musl.zip
            ${{ runner.temp }}/duckdb-transfer/duckdb
            ${{ runner.temp }}/duckdb-transfer/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
