name: DuckDB offline transfer

on:
  push:
    branches:
      - ops/duckdb-offline-transfer
    paths:
      - .github/workflows/duckdb-offline-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out transfer contract
        uses: actions/checkout@v4

      - name: Download and verify official DuckDB release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duckdb-transfer"
          cd "$RUNNER_TEMP/duckdb-transfer"
          curl --fail --location --retry 3 \
            --output duckdb_cli-linux-amd64.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/duckdb_cli-linux-amd64.zip
          actual_size=$(wc -c < duckdb_cli-linux-amd64.zip | tr -d '[:space:]')
          test "$actual_size" = 21263499
          echo '08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05  duckdb_cli-linux-amd64.zip' \
            | sha256sum -c -
          mapfile -t entries < <(unzip -Z1 duckdb_cli-linux-amd64.zip)
          test "${#entries[@]}" -eq 1
          test "${entries[0]}" = duckdb
          unzip -p duckdb_cli-linux-amd64.zip duckdb > duckdb
          chmod 0755 duckdb
          file_output=$(file -b duckdb)
          grep -F 'ELF 64-bit' <<<"$file_output"
          grep -F 'x86-64' <<<"$file_output"
          interpreter=$(readelf -l duckdb | sed -n 's/.*Requesting program interpreter: \(.*\)]/\1/p')
          test "$interpreter" = /lib64/ld-linux-x86-64.so.2
          version_output=$(./duckdb --version)
          test "$version_output" = 'v1.5.5 (Variegata) d8cdaa33fd'
          smoke_output=$(./duckdb :memory: -csv -noheader -c 'SELECT 42;')
          test "$smoke_output" = 42
          payload_size=$(wc -c < duckdb | tr -d '[:space:]')
          payload_sha=$(sha256sum duckdb | awk '{print $1}')
          test "$payload_size" = 61936648
          test "$payload_sha" = 3d33b1df037cb049155c393778df7853fafb23e9d49d7c9cacdde4dd67155788

          docker pull ubuntu:24.04
          cold_room_output=$(docker run --rm --network none \
            --mount type=bind,source="$RUNNER_TEMP/duckdb-transfer",target=/payload,readonly \
            ubuntu:24.04 \
            /payload/duckdb :memory: -csv -noheader -c 'SELECT 42;')
          test "$cold_room_output" = 42

          python3 - "$version_output" "$smoke_output" "$payload_size" "$payload_sha" "$file_output" "$interpreter" "$cold_room_output" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" <<'PY'
          import json
          import sys
          from pathlib import Path
          version, smoke, payload_size, payload_sha, file_output, interpreter, cold_room, workflow_run = sys.argv[1:]
          receipt = {
              "schema_version": 1,
              "release_tag": "v1.5.5",
              "source_commit": "d8cdaa33fda8df955cc76ef58a280f68f4cd43fa",
              "workflow_run": workflow_run,
              "transport": {
                  "name": "duckdb_cli-linux-amd64.zip",
                  "bytes": 21263499,
                  "sha256": "08c0ca117111fcede14239d0093792352befdc174218c344d232c13279643d05",
                  "upstream_asset_id": 485846903,
              },
              "payload": {
                  "name": "duckdb",
                  "bytes": int(payload_size),
                  "sha256": payload_sha,
                  "version_output": version,
                  "format": file_output,
                  "interpreter": interpreter,
              },
              "checks": {
                  "transport_identity": "passed",
                  "archive_shape": "passed",
                  "payload_identity": "passed",
                  "ubuntu_execution": "passed",
                  "version": "passed",
                  "smoke_sql": "passed",
                  "cold_room": "passed",
              },
              "cold_room": {
                  "driver": "docker",
                  "image": "ubuntu:24.04",
                  "network": "none",
                  "smoke_output": cold_room,
              },
              "smoke_sql": "SELECT 42;",
              "smoke_output": smoke,
          }
          Path("verification.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload verified transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-1.5.5-linux-amd64-transfer
          path: |
            ${{ runner.temp }}/duckdb-transfer/duckdb_cli-linux-amd64.zip
            ${{ runner.temp }}/duckdb-transfer/duckdb
            ${{ runner.temp }}/duckdb-transfer/verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
