name: ETH pinned Lean stage (reusable)

on:
  workflow_call:
    inputs:
      stage:
        description: Unique checkpoint suffix
        required: true
        type: string
      previous:
        description: Previous checkpoint suffix
        required: true
        type: string

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact OpenAI Lean source
        uses: actions/checkout@v4
        with:
          repository: openai/math
          ref: 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a
          path: source
          persist-credentials: false
          sparse-checkout: |
            lean
          sparse-checkout-cone-mode: true

      - name: Install Lean 4.34.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          if timeout 210s elan toolchain install leanprover/lean4:v4.34.1; then
            elan default leanprover/lean4:v4.34.1
          else
            echo 'Official Lean release endpoint failed; trying the pinned GitHub release asset.'
            curl -fL --retry 4 --retry-all-errors --connect-timeout 20 --max-time 720 \
              https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst \
              -o /tmp/lean-4.34.1-linux.tar.zst
            echo '47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  /tmp/lean-4.34.1-linux.tar.zst' | sha256sum --check
            mkdir -p "$HOME/lean-4.34.1-pinned"
            tar -I zstd -xf /tmp/lean-4.34.1-linux.tar.zst \
              -C "$HOME/lean-4.34.1-pinned" --strip-components=1
            rm -f /tmp/lean-4.34.1-linux.tar.zst
            elan toolchain link lean-4.34.1-pinned "$HOME/lean-4.34.1-pinned"
            export ELAN_TOOLCHAIN=lean-4.34.1-pinned
            echo 'ELAN_TOOLCHAIN=lean-4.34.1-pinned' >> "$GITHUB_ENV"
          fi
          lean --version | tee "$RUNNER_TEMP/lean-version.txt"
          grep -F 'Lean (version 4.34.1,' "$RUNNER_TEMP/lean-version.txt"
          lake --version

      - name: Hydrate pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd source/lean
          test "$(git -C .. rev-parse HEAD)" = 7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.34.1
          timeout 540s lake update
          git diff --exit-code -- lake-manifest.json
          expected_manifest='cf6105a25d9dca2f166b241d9191bd12c7e13305890dc9c4d0952351cccc0794'
          test "$(git show HEAD:lean/lake-manifest.json | sha256sum | cut -d' ' -f1)" = "$expected_manifest"
          test "$(sha256sum lake-manifest.json | cut -d' ' -f1)" = "$expected_manifest"
          timeout 540s lake exe cache get

      - name: Restore preceding Lean compilation checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: source/lean/.lake/build
          key: eth-lean-7ef5c0c-v1-${{ github.run_id }}-${{ inputs.previous }}
          restore-keys: |
            eth-lean-7ef5c0c-v1-40641329372-05
            eth-lean-7ef5c0c-v1-40629044604-03

      - name: Compile bounded stage; stream all output
        id: bounded
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GLIBC_TUNABLES='glibc.malloc.mmap_max=0:glibc.malloc.arena_max=1'
          export LEAN_NUM_THREADS=2
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          ev="$GITHUB_WORKSPACE/evidence"
          cd source/lean
          printf 'source=%s\ncompiler=%s\nmanifest_sha256=%s\nstage=%s\n' \
            "$(git -C .. rev-parse HEAD)" "$(lean --version)" \
            "$(sha256sum lake-manifest.json | cut -d' ' -f1)" "$STAGE" > "$ev/identity.txt"
          printf 'Stage %s; restoring build outputs from prior stage.\n' "$STAGE"
          du -sh .lake/build 2>/dev/null || true
          set +e
          timeout --signal=INT --kill-after=30s 1020s lake build \
            OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.Final 2>&1 | tee "$ev/lake-build.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'lake-build=%s\n' "$result" > "$ev/status.txt"
          du -sh .lake/build 2>/dev/null | tee "$ev/build-directory-size.txt" || true
          tail -n 40 "$ev/lake-build.log"
          if [ "$result" -ne 0 ] && [ "$result" -ne 124 ]; then
            echo 'Compilation returned a non-timeout failure' >&2
            exit "$result"
          fi
          if [ "$result" -eq 124 ]; then
            echo 'CHECKPOINT_ONLY: bounded compilation interrupted; preserving completed outputs.'
            exit 0
          fi
          echo 'BUILD_COMPLETE=true' >> "$GITHUB_ENV"
          echo 'Build complete. Running the final Lean elaboration and axiom report.'
          set +e
          timeout 360s lake env lean \
            OAI/Algorithms/SubexponentialSAT/SqrtLogSpace/Final.lean 2>&1 | tee "$ev/lean-final.log"
          result=${PIPESTATUS[0]}
          set -e
          printf 'lean-final=%s\n' "$result" >> "$ev/status.txt"
          test "$result" -eq 0
          python3 - "$ev/lean-final.log" "$ev/axiom-verdict.json" <<'PY'
          import json, pathlib, re, sys
          content = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          prefix = "OAI.Algorithms.SubexponentialSAT.SqrtLogSpace."
          expected = {
              "compiled_exact_count_and_sat", "exact_count_and_sat",
              "exact_count_eth", "sat_polynomial_space", "original_sat_main"
          }
          permitted = {"propext", "Quot.sound", "Classical.choice"}
          observed = {}
          duplicates = []
          matches = []
          for match in re.finditer(
              r"(?m)^'([A-Za-z0-9_.]+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",
              content,
          ):
              full = match.group(1)
              if full.startswith(prefix):
                  matches.append(match)
                  short = full[len(prefix):]
                  if short in observed:
                      duplicates.append(short)
                  observed[short] = [
                      ax.strip() for ax in (match.group(2) or "").split(",") if ax.strip()
                  ]
          report_starts = sum(line.startswith("'" + prefix) for line in content.splitlines())
          malformed = report_starts != len(matches)
          missing = sorted(expected - observed.keys())
          unexpected = sorted(observed.keys() - expected)
          disallowed = {name: sorted(set(vals) - permitted)
                        for name, vals in observed.items() if set(vals) - permitted}
          verdict = {"observed": observed, "missing": missing, "unexpected": unexpected,
                     "duplicates": duplicates, "malformed": malformed, "disallowed": disallowed,
                     "sorry_ax": "sorryAx" in content,
                     "accepted": not missing and not unexpected and not duplicates
                                 and not malformed and not disallowed and "sorryAx" not in content}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict, indent=2))
          if not verdict["accepted"]:
              raise SystemExit(1)
          PY

      - name: Save incremental Lean build checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: source/lean/.lake/build
          key: eth-lean-7ef5c0c-v1-${{ github.run_id }}-${{ inputs.stage }}

      - name: Upload immutable checkpoint status and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-lean-stage-${{ inputs.stage }}-logs
          path: evidence/
          retention-days: 5
          if-no-files-found: warn
          compression-level: 6
