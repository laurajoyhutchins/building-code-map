name: Finalize Colorado production data

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Finalize Colorado data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile canonical artifacts
        run: python reports/tools/regulatory.py compile reports/pilots/*.md --output-dir backend/data/regulatory

      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-colorado-data.yml

      - name: Commit canonical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/pilots/colorado.md backend/data/regulatory/colorado.json backend/data/regulatory/rules/colorado.json reports/production/colorado.json .github/workflows/finalize-colorado-data.yml
          git commit -m "data: complete Colorado electrical production evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
